<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Long page fixture</title>
    <style>
      body {
        margin: 0;
        font: 14px system-ui;
      }
      section {
        height: 220px;
        padding: 20px;
        border-bottom: 1px solid #ddd;
      }
      #target {
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div id="sections"></div>
    <script>
      const root = document.querySelector('#sections');
      for (let i = 0; i < 700; i += 1) {
        const section = document.createElement('section');
        section.textContent = `Content block ${i + 1}`;
        root.append(section);
      }
      const target = document.createElement('button');
      target.id = 'target';
      target.textContent = 'Bottom action';
      root.lastElementChild.append(target);
    </script>
  </body>
</html>
